services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: commitmentos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - commitmentos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d commitmentos']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  commitmentos_postgres_data:
